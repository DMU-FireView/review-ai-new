[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-ai-new"
version = "0.1.0"
description = "AI analysis service for Re:view"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
ml = [
    "accelerate>=1.2,<2.0",
    "numpy>=1.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "torch>=2.2,<3.0",
    "transformers>=4.46,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
